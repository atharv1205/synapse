<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Synapse: map a codebase by what it depends on">
  <title>Synapse: map a codebase by what it depends on</title>
  <defs>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#e6eaf2"/>
      <stop offset="0.35" stop-color="#e6eaf2"/>
      <stop offset="0.45" stop-color="#4fd1e8"/>
      <stop offset="0.5" stop-color="#7be08a"/>
      <stop offset="0.55" stop-color="#f2b84b"/>
      <stop offset="0.65" stop-color="#e6eaf2"/>
      <stop offset="1" stop-color="#e6eaf2"/>
      <!-- One sweep of the importance ramp across the word, then it rests white. -->
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" begin="1.9s" dur="1.6s" fill="freeze"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd1e8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4fd1e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="focus" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0">
        <animate attributeName="stdDeviation" values="18;0" begin="1.3s" dur="1.1s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      </feGaussianBlur>
    </filter>
    <style>
      .word { font: 600 132px -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -4px; }
      .tag { font: 400 26px -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #a6afc8; letter-spacing: 0.2px; }
      .edge { stroke: #34416e; stroke-width: 1.4; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .word-wrap { opacity: 0; animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards; }
      .tag { opacity: 0; animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 2.6s forwards; }
      .halo { opacity: 0; animation: fade 2s ease-out 1.4s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .edge, .node, .word-wrap, .tag, .halo { animation: none; opacity: 1; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#0b1020"/>
  <ellipse class="halo" cx="600" cy="200" rx="420" ry="190" fill="url(#glow)"/>

  <!-- The constellation: files lighting up, then the imports between them. -->
  <g>
    <path class="edge" pathLength="1" style="animation-delay:.35s" d="M96 118 L214 72 L318 150"/>
    <path class="edge" pathLength="1" style="animation-delay:.45s" d="M214 72 L170 262 L96 318"/>
    <path class="edge" pathLength="1" style="animation-delay:.55s" d="M318 150 L170 262"/>
    <path class="edge" pathLength="1" style="animation-delay:.5s"  d="M1104 102 L986 70 L880 146"/>
    <path class="edge" pathLength="1" style="animation-delay:.6s"  d="M986 70 L1036 256 L1112 330"/>
    <path class="edge" pathLength="1" style="animation-delay:.7s"  d="M880 146 L1036 256"/>
    <path class="edge" pathLength="1" style="animation-delay:.8s"  d="M318 150 C 460 110, 740 110, 880 146"/>
  </g>
  <g>
    <circle class="node" style="animation-delay:.05s" cx="96" cy="118" r="5" fill="#2b6f88"/>
    <circle class="node" style="animation-delay:.12s" cx="214" cy="72" r="8" fill="#4fd1e8"/>
    <circle class="node" style="animation-delay:.2s"  cx="318" cy="150" r="11" fill="#7be08a"/>
    <circle class="node" style="animation-delay:.28s" cx="170" cy="262" r="7" fill="#4fd1e8"/>
    <circle class="node" style="animation-delay:.34s" cx="96" cy="318" r="4" fill="#2b6f88"/>
    <circle class="node" style="animation-delay:.1s"  cx="1104" cy="102" r="5" fill="#2b6f88"/>
    <circle class="node" style="animation-delay:.18s" cx="986" cy="70" r="9" fill="#4fd1e8"/>
    <circle class="node" style="animation-delay:.26s" cx="880" cy="146" r="14" fill="#f2b84b"/>
    <circle class="node" style="animation-delay:.32s" cx="1036" cy="256" r="7" fill="#7be08a"/>
    <circle class="node" style="animation-delay:.4s"  cx="1112" cy="330" r="4" fill="#2b6f88"/>
  </g>

  <g class="word-wrap">
    <text class="word" x="600" y="238" text-anchor="middle" fill="url(#ink)" filter="url(#focus)">Synapse</text>
  </g>
  <text class="tag" x="600" y="300" text-anchor="middle">Map a codebase by what it depends on.</text>
</svg>
