name: Bug report
description: Something does not work, crashes, or gives a wrong result.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include API keys or GitHub tokens. Security
        problems go through the Security tab instead; see SECURITY.md.
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran, or what you did in the explorer.
      placeholder: npx synapse-map serve https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the full error output, or a screenshot for the explorer.
      render: text
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Repository
      description: A link to the repository you analysed, if it is public. It is the most useful thing for ranking and parsing bugs.
  - type: input
    id: version
    attributes:
      label: synapse-map version
      description: Output of `npx synapse-map --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: macOS 15 on arm64, Node 22.11
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Who was summarising and answering, if that matters for the bug.
      options:
        - Not relevant
        - Ollama (local)
        - Gemini
        - Claude
