# Builds, tests and smoke-tests the packaged CLI on every push and pull request.
# Nothing here publishes: the tarball is packed, installed into a scratch directory and
# run, then thrown away.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # Churn reads git history; a shallow checkout would give every file one commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Builds every package in dependency order, then runs the core, server and CLI suites.
      - run: npm test

      # Assembles release/synapse-map-<version>.tgz, failing on any undeclared import.
      - run: npm run release:pack

      # Installs that tarball into an empty directory and runs analyze and serve from it.
      - run: npm run smoke
