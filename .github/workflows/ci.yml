# Build, test and smoke-test the packaged CLI on every push and PR.
# Nothing gets published here: the tarball is packed, installed in a scratch folder, run,
# and thrown away.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          # Churn reads git history. A shallow checkout would give every file one commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Builds all packages in order, then runs every test suite.
      - run: npm test

      # Builds release/synapse-map-<version>.tgz. Fails if anything imports an undeclared
      # package.
      - run: npm run release:pack

      # Installs that tarball in an empty folder and runs analyze and serve from it.
      - run: npm run smoke
